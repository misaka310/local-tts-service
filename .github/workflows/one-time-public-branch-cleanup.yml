name: One-time public branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches=(
            "codex/verify-orpheus-f67"
            "codex/verify-pr17-asmr"
            "feat/asmr-tts-models"
            "policy/actions-guard-20260903"
            "tmp/debate-male-voice-20260831"
            "maintenance/public-branch-cleanup"
          )
          for branch in "${branches[@]}"; do
            status="$(curl --silent --show-error --location \
              --output /tmp/delete-ref-response \
              --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GH_REPO}/git/refs/heads/${branch}" || true)"
            if [[ "${status}" != "204" && "${status}" != "404" && "${status}" != "422" ]]; then
              echo "Failed to delete ${branch}: HTTP ${status}" >&2
              cat /tmp/delete-ref-response >&2 || true
              exit 1
            fi
          done
