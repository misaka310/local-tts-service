name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r config/requirements.txt

      - name: Lint app factory boundary
        run: python -m ruff check --select I,UP,B src/local_tts_service/api/app.py tests/test_api_app_factory.py

      - name: Run backend tests
        run: python -m pytest --rootdir=. -c config/pytest.ini tests

      - name: Check app factory coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch -m pytest --rootdir=. -c config/pytest.ini tests/test_api_app_factory.py
          python -m coverage report --include="src/local_tts_service/api/app.py" --fail-under=70

      - name: Verify setup dry run
        shell: powershell
        run: ./scripts/test-setup-local-tts.ps1

      - name: Verify managed process safety
        shell: powershell
        run: ./scripts/test-managed-processes.ps1

      - name: Verify managed Job Object
        shell: powershell
        run: ./scripts/test-managed-job.ps1

      - name: Verify public history auditor
        run: python scripts/test_public_history_audit.py

      - name: Audit public working tree
        run: python scripts/audit_public_history.py --repo-root . --output runtime/audits/public-history-audit.json --fail-on-working-tree-findings

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend scripts
        working-directory: frontend
        run: npm run check

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Run browser E2E
        working-directory: frontend
        run: |
          npm run e2e:qwen-ui
          npm run e2e:rvc-tabs
          npm run e2e:rvc-convert
