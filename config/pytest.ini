[pytest]
testpaths = ../tests ../scripts
python_files = test_*.py
norecursedirs = ../.git ../.venv ../runtime ../frontend/node_modules
# StarletteDeprecationWarning is not available in every supported Starlette version.
filterwarnings =
    error:Using `httpx` with `starlette\.testclient` is deprecated:DeprecationWarning
